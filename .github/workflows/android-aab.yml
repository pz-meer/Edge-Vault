name: Build EdgeVault Android AAB

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-aab.yml'
      - 'EDGEVAULT_Android_Project.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-source
          unzip -q EDGEVAULT_Android_Project.zip -d android-source
          SETTINGS="$(find android-source -type f -name settings.gradle -o -name settings.gradle.kts | head -1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found in Android project archive."
            find android-source -maxdepth 5 -type f | head -100
            exit 1
          fi
          PROJECT="$(dirname "$SETTINGS")"
          WRAPPER="$PROJECT/gradlew"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          if [ -f "$WRAPPER" ]; then
            chmod +x "$WRAPPER"
            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"
          else
            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"
            echo "Gradle wrapper missing; will use installed Gradle."
          fi

      - name: Set up Gradle
        if: env.USE_WRAPPER == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ "$USE_WRAPPER" = "true" ]; then
            ./gradlew --no-daemon bundleRelease
          else
            gradle --no-daemon bundleRelease
          fi

      - name: Find generated AAB
        id: find-aab
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/bundle/*/*.aab' -print -quit)"
          if [ -z "$AAB" ]; then
            echo "::error::Gradle finished but no .aab file was found."
            exit 1
          fi
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"
          echo "AAB generated at: $AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeVault-Android-AAB
          path: ${{ steps.find-aab.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 14
