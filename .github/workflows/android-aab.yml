name: Build EdgeVault Android APK and AAB

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-aab.yml'
      - 'EDGEVAULT_Android_Project.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-source
          unzip -q EDGEVAULT_Android_Project.zip -d android-source
          SETTINGS="$(find android-source -type f -name settings.gradle -o -name settings.gradle.kts | head -1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found in Android project archive."
            find android-source -maxdepth 5 -type f | head -100
            exit 1
          fi
          PROJECT="$(dirname "$SETTINGS")"
          WRAPPER="$PROJECT/gradlew"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          if [ -f "$WRAPPER" ]; then
            chmod +x "$WRAPPER"
            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"
          else
            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"
            echo "Gradle wrapper missing; will use installed Gradle."
          fi

      - name: Inspect Android project features before build
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PROJECT FILES ==="
          find "$PROJECT_DIR" -maxdepth 5 -type f | sort | head -250
          echo "=== CONFIG AND SOURCE SEARCH ==="
          grep -RniE --include='*.gradle' --include='*.gradle.kts' --include='AndroidManifest.xml' --include='*.kt' --include='*.java' --include='*.xml' 'firebase|google.signin|google-services|play-services-auth|mobile.ads|admob|test.ad|banner|rewarded|interstitial|WebView|MainActivity|applicationId|namespace' "$PROJECT_DIR" 2>/dev/null | head -300 || true
          echo "=== MANIFESTS ==="
          find "$PROJECT_DIR" -name AndroidManifest.xml -type f -print -exec sed -n '1,220p' {} \;
          echo "=== GRADLE FILES ==="
          find "$PROJECT_DIR" -maxdepth 3 \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -type f -print -exec sed -n '1,220p' {} \;

      - name: Set up Gradle
        if: env.USE_WRAPPER == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure EDGEVAULT splash animation, fullscreen interstitials, and icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("android-source")
          gradle=next(root.rglob("app/build.gradle"))
          s=gradle.read_text()
          dep="implementation 'com.google.android.gms:play-services-ads:24.6.0'"
          if "play-services-ads" not in s:
              if "dependencies {" in s:
                  s=s.replace("dependencies {", "dependencies {\n    "+dep, 1)
              else:
                  s += "\ndependencies {\n    "+dep+"\n}\n"
              gradle.write_text(s)
          manifest=next(root.rglob("app/src/main/AndroidManifest.xml"))
          s=manifest.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s=s.replace("</application>", '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>')
              manifest.write_text(s)
          app=gradle.parent
          res=app/"src/main/res"
          for folder in ["drawable","mipmap-mdpi","mipmap-hdpi","mipmap-xhdpi","mipmap-xxhdpi","mipmap-xxxhdpi","mipmap-anydpi-v26"]:
              (res/folder).mkdir(parents=True,exist_ok=True)
          (res/"drawable/edgevault_icon_bg.xml").write_text('''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="24dp"/><gradient android:angle="315" android:startColor="#287BFF" android:centerColor="#5265F5" android:endColor="#8742F6"/></shape>''')
          fg='''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FFFFFFFF" android:pathData="M13,31 L45,31 L49,41 L28,41 L25,48 L45,48 L41,57 L21,57 L18,65 L43,65 L39,75 L7,75 Z"/><path android:fillColor="#FFFFFFFF" android:pathData="M48,31 L61,31 L72,57 L84,31 L98,31 L79,78 L68,78 Z"/></vector>'''
          (res/"drawable/edgevault_icon_fg.xml").write_text(fg)
          (res/"mipmap-anydpi-v26/ic_launcher.xml").write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/edgevault_icon_bg"/><foreground android:drawable="@drawable/edgevault_icon_fg"/></adaptive-icon>''')
          for d in ["mdpi","hdpi","xhdpi","xxhdpi","xxxhdpi"]:
              (res/f"mipmap-{d}/ic_launcher.xml").unlink(missing_ok=True)
          java=next(root.rglob("app/src/main/java/**/MainActivity.java"))
          java.write_text(r'''package com.edgevault.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.content.Intent;
          import android.content.ActivityNotFoundException;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.view.View;
          import android.view.Gravity;
          import android.view.animation.AccelerateDecelerateInterpolator;
          import android.webkit.*;
          import android.widget.*;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.animation.ObjectAnimator;
          import android.animation.AnimatorSet;
          import com.google.android.gms.ads.*;
          import com.google.android.gms.ads.interstitial.InterstitialAd;
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback;
          public class MainActivity extends Activity {
            private static final int FILE_CHOOSER_REQUEST=4107;
            private static final String INTERSTITIAL_ID="ca-app-pub-3940256099942544/1033173712";
            private static final long AD_INTERVAL_MS=10L*60L*1000L;
            private WebView webView; private ValueCallback<Uri[]> filePathCallback;
            private InterstitialAd interstitialAd;
            private final Handler handler=new Handler(Looper.getMainLooper());
            private boolean activityVisible=false; private boolean splashFinished=false; private boolean adShowing=false; private boolean initialAdPending=true;
            private final Runnable intervalAdRunnable=new Runnable(){@Override public void run(){if(activityVisible&&!isFinishing()&&!isDestroyed())showInterstitialIfReady();handler.postDelayed(this,AD_INTERVAL_MS);}};
            @Override public void onCreate(Bundle state){
              super.onCreate(state);
              MobileAds.initialize(this,status->{});
              LinearLayout content=new LinearLayout(this); content.setOrientation(LinearLayout.VERTICAL); content.setBackgroundColor(Color.WHITE);
              webView=new WebView(this); content.addView(webView,new LinearLayout.LayoutParams(-1,0,1f));
              FrameLayout stage=new FrameLayout(this); stage.addView(content,new FrameLayout.LayoutParams(-1,-1));
              FrameLayout splash=new FrameLayout(this);
              GradientDrawable bg=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{Color.rgb(26,103,239),Color.rgb(75,85,225),Color.rgb(119,51,205)});
              splash.setBackground(bg);
              TextView logo=new TextView(this); logo.setText("EDGEVAULT"); logo.setTextColor(Color.WHITE); logo.setTextSize(30); logo.setTypeface(Typeface.create("sans-serif-black",Typeface.BOLD)); logo.setLetterSpacing(0.12f); logo.setGravity(Gravity.CENTER);
              logo.setShadowLayer(24f,0f,0f,Color.rgb(190,220,255));
              FrameLayout.LayoutParams lp=new FrameLayout.LayoutParams(-1,-2,Gravity.CENTER); lp.setMargins(22,0,22,0); splash.addView(logo,lp);
              TextView tagline=new TextView(this); tagline.setText("TRADE SMART. STAY DISCIPLINED."); tagline.setTextColor(Color.rgb(231,237,255)); tagline.setTextSize(10); tagline.setLetterSpacing(0.16f); tagline.setGravity(Gravity.CENTER);
              FrameLayout.LayoutParams tlp=new FrameLayout.LayoutParams(-1,-2,Gravity.CENTER); tlp.topMargin=100; splash.addView(tagline,tlp);
              stage.addView(splash,new FrameLayout.LayoutParams(-1,-1)); setContentView(stage);
              logo.setAlpha(0f); logo.setScaleX(0.78f); logo.setScaleY(0.78f);
              ObjectAnimator a=ObjectAnimator.ofFloat(logo,View.ALPHA,0f,1f); a.setDuration(750);
              ObjectAnimator sx=ObjectAnimator.ofFloat(logo,View.SCALE_X,0.78f,1.04f,1f); sx.setDuration(1050);
              ObjectAnimator sy=ObjectAnimator.ofFloat(logo,View.SCALE_Y,0.78f,1.04f,1f); sy.setDuration(1050);
              AnimatorSet anim=new AnimatorSet(); anim.playTogether(a,sx,sy); anim.setInterpolator(new AccelerateDecelerateInterpolator()); anim.start();
              loadInterstitial();
              WebSettings s=webView.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setMediaPlaybackRequiresUserGesture(false); s.setSupportZoom(false); s.setBuiltInZoomControls(false); s.setDisplayZoomControls(false);
              webView.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){Uri u=r.getUrl();String scheme=u.getScheme();if("http".equals(scheme)||"https".equals(scheme)){try{startActivity(new Intent(Intent.ACTION_VIEW,u));}catch(ActivityNotFoundException ignored){}return true;}return false;}});
              webView.setWebChromeClient(new WebChromeClient(){@Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> cb,FileChooserParams params){if(filePathCallback!=null)filePathCallback.onReceiveValue(null);filePathCallback=cb;try{startActivityForResult(params.createIntent(),FILE_CHOOSER_REQUEST);}catch(ActivityNotFoundException e){filePathCallback=null;return false;}return true;}});
              if(state!=null)webView.restoreState(state);else webView.loadUrl("file:///android_asset/index.html");
              handler.postDelayed(()->{splash.animate().alpha(0f).setDuration(350).withEndAction(()->{stage.removeView(splash);splashFinished=true;showInterstitialIfReady();handler.removeCallbacks(intervalAdRunnable);handler.postDelayed(intervalAdRunnable,AD_INTERVAL_MS);if(android.os.Build.VERSION.SDK_INT>=33&&checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},7101);}).start();},1800);
            }
            private void loadInterstitial(){InterstitialAd.load(this,INTERSTITIAL_ID,new AdRequest.Builder().build(),new InterstitialAdLoadCallback(){
              @Override public void onAdLoaded(InterstitialAd ad){interstitialAd=ad;if(splashFinished&&initialAdPending)showInterstitialIfReady();}
              @Override public void onAdFailedToLoad(LoadAdError error){interstitialAd=null;handler.postDelayed(()->{if(!isFinishing()&&!isDestroyed())loadInterstitial();},15000L);}
            });}
            private void showInterstitialIfReady(){
              if(!splashFinished||!activityVisible||adShowing||isFinishing()||isDestroyed()||interstitialAd==null)return;
              InterstitialAd ad=interstitialAd; interstitialAd=null; adShowing=true; initialAdPending=false;
              ad.setFullScreenContentCallback(new FullScreenContentCallback(){
                @Override public void onAdDismissedFullScreenContent(){adShowing=false;loadInterstitial();}
                @Override public void onAdFailedToShowFullScreenContent(AdError error){adShowing=false;loadInterstitial();}
              });
              ad.show(this);
            }
            @Override protected void onResume(){super.onResume();activityVisible=true;if(splashFinished)handler.postDelayed(intervalAdRunnable,AD_INTERVAL_MS);}
            @Override protected void onPause(){activityVisible=false;handler.removeCallbacks(intervalAdRunnable);super.onPause();}
            @Override protected void onSaveInstanceState(Bundle out){if(webView!=null)webView.saveState(out);super.onSaveInstanceState(out);}
            @Override public void onBackPressed(){if(webView!=null&&webView.canGoBack())webView.goBack();else super.onBackPressed();}
            @Override protected void onActivityResult(int requestCode,int resultCode,Intent data){super.onActivityResult(requestCode,resultCode,data);if(requestCode==FILE_CHOOSER_REQUEST&&filePathCallback!=null){filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode,data));filePathCallback=null;}}
            @Override protected void onDestroy(){handler.removeCallbacksAndMessages(null);if(filePathCallback!=null){filePathCallback.onReceiveValue(null);filePathCallback=null;}if(webView!=null){webView.destroy();webView=null;}super.onDestroy();}
          }''')
          print("Configured animated EDGEVAULT launch screen, fullscreen interstitial test ads, banner test ad, and EV-style icon. Removed rewarded-ad button.")
          PY

      - name: Add native scheduled notifications for existing HTML reminders
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("android-source")
          manifest=next(root.rglob("app/src/main/AndroidManifest.xml"))
          app=next(root.rglob("app/build.gradle")).parent
          java=next(root.rglob("app/src/main/java/**/MainActivity.java"))
          source=java.read_text()
          m=re.search(r'^package\s+([\w.]+);',source,re.M)
          if not m: raise SystemExit("Cannot determine MainActivity package")
          pkg=m.group(1)
          # Receiver posts local notifications after app activity is no longer running.
          receiver='''package PKG;
          import android.app.*;
          import android.content.*;
          import android.os.Build;
          public class ReminderReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent i) {
              String title=i.getStringExtra("title"); String body=i.getStringExtra("body");
              if(title==null)title="EDGEVAULT reminder"; if(body==null)body="Your scheduled reminder is due.";
              NotificationManager nm=(NotificationManager)c.getSystemService(Context.NOTIFICATION_SERVICE);
              if(Build.VERSION.SDK_INT>=26)nm.createNotificationChannel(new NotificationChannel("edgevault_reminders","EDGEVAULT reminders",NotificationManager.IMPORTANCE_HIGH));
              Notification.Builder b=Build.VERSION.SDK_INT>=26?new Notification.Builder(c,"edgevault_reminders"):new Notification.Builder(c);
              b.setSmallIcon(c.getApplicationInfo().icon).setContentTitle(title).setContentText(body).setAutoCancel(true);
              nm.notify(i.getIntExtra("nid",1001),b.build());
            }
          }'''.replace("PKG",pkg)
          (java.parent/"ReminderReceiver.java").write_text(receiver)
          # Inject native bridge and a JS sync that reads the app's own saved db object (the key is discovered, not hardcoded).
          bridge='''private void scheduleReminder(String id,int hour,int minute,boolean enabled,String title,String body) {
              android.app.AlarmManager am=(android.app.AlarmManager)getSystemService(ALARM_SERVICE);
              int nid=1000+Math.abs(id.hashCode()%50000);
              android.content.Intent i=new android.content.Intent(this, ReminderReceiver.class);
              i.putExtra("title",title); i.putExtra("body",body); i.putExtra("nid",nid);
              android.app.PendingIntent pi=android.app.PendingIntent.getBroadcast(this,nid,i,android.app.PendingIntent.FLAG_UPDATE_CURRENT|android.app.PendingIntent.FLAG_IMMUTABLE);
              am.cancel(pi); if(!enabled)return;
              java.util.Calendar c=java.util.Calendar.getInstance(); c.set(java.util.Calendar.HOUR_OF_DAY,hour); c.set(java.util.Calendar.MINUTE,minute); c.set(java.util.Calendar.SECOND,0); c.set(java.util.Calendar.MILLISECOND,0);
              if(c.getTimeInMillis()<=System.currentTimeMillis())c.add(java.util.Calendar.DAY_OF_YEAR,1);
              if(android.os.Build.VERSION.SDK_INT>=23) {
                if(android.os.Build.VERSION.SDK_INT<31 || am.canScheduleExactAlarms()) am.setExactAndAllowWhileIdle(android.app.AlarmManager.RTC_WAKEUP,c.getTimeInMillis(),pi);
                else am.setAndAllowWhileIdle(android.app.AlarmManager.RTC_WAKEUP,c.getTimeInMillis(),pi);
              } else am.setExact(android.app.AlarmManager.RTC_WAKEUP,c.getTimeInMillis(),pi);
          }
          '''
          source=source.replace('private WebView webView;', 'private WebView webView;\n'+bridge)
          # Add bridge after WebView setup; sync app's existing localStorage notification model.
          source=source.replace('WebSettings s=webView.getSettings();', '''webView.addJavascriptInterface(new Object(){
                @android.webkit.JavascriptInterface public void schedule(String id,int h,int m,boolean enabled,String title,String body){runOnUiThread(()->scheduleReminder(id,h,m,enabled,title,body));}
                @android.webkit.JavascriptInterface public void notifyUser(String title,String body,int nid){runOnUiThread(()->{if(android.os.Build.VERSION.SDK_INT>=33&&checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED){requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},7101);return;}android.app.NotificationManager nm=(android.app.NotificationManager)getSystemService(NOTIFICATION_SERVICE);if(android.os.Build.VERSION.SDK_INT>=26)nm.createNotificationChannel(new android.app.NotificationChannel("edgevault_reminders","EDGEVAULT reminders",android.app.NotificationManager.IMPORTANCE_HIGH));android.app.Notification.Builder b=android.os.Build.VERSION.SDK_INT>=26?new android.app.Notification.Builder(MainActivity.this,"edgevault_reminders"):new android.app.Notification.Builder(MainActivity.this);b.setSmallIcon(getApplicationInfo().icon).setContentTitle(title).setContentText(body).setAutoCancel(true);nm.notify(nid,b.build());});}
                @android.webkit.JavascriptInterface public void cancelAll(){runOnUiThread(()->{android.app.AlarmManager am=(android.app.AlarmManager)getSystemService(ALARM_SERVICE);});}
              },"EdgeVaultReminder");
              WebSettings s=webView.getSettings();''')
          js='''function __edgevaultSyncReminders(){
            try {
              const titles={asia:["Asia session started","Asia is open. Build your setup for the day, or note a wish or plan. Keep risk small."],ls:["London session started","London is open. Volume is rising, so stay patient and wait for your setup."],lsb:["London Silver Bullet time","The London Silver Bullet window is open now. Look for your setup and stay disciplined."],ny:["New York session started","New York is open. Stay disciplined before entering."],nsb:["New York Silver Bullet time","The New York Silver Bullet window is open now. Look for your setup and stay disciplined."],le:["London session ended","London is closed. Review your trades."],d1:["Data entry reminder 1 of 3","You have not logged any data today. Open EDGEVAULT and add your entry."],d2:["Data entry reminder 2 of 3","Still no data entered today. Log your trades while they are fresh."],d3:["Final data entry reminder","Last reminder: log your data so your journal stays complete."]};
              let db=null; for(let i=0;i<localStorage.length;i++){try{let x=JSON.parse(localStorage.getItem(localStorage.key(i)));if(x&&x.nt&&x.nt.dt&&x.nt.ev){db=x;break}}catch(e){}}
              if(!db||!window.EdgeVaultReminder)return;
              const ids=Object.keys(titles);ids.forEach(id=>{let t=String((db.nt.dt||{})[id]||"09:00").split(":");let h=parseInt(t[0],10),m=parseInt(t[1],10);if(!Number.isFinite(h)||!Number.isFinite(m))return;EdgeVaultReminder.schedule(id,h,m,!!db.nt.on&&!!db.nt.ev[id],titles[id][0],titles[id][1]);});
            }catch(e){console.log("Reminder sync failed",e)}
          }; __edgevaultSyncReminders(); setInterval(__edgevaultSyncReminders,5000);'''
          # Add receiver declaration and permissions.
          ms=manifest.read_text()
          if "ReminderReceiver" not in ms:
              ms=ms.replace("</application>", '<receiver android:name=".ReminderReceiver" android:enabled="true" android:exported="false" /></application>')
          if "POST_NOTIFICATIONS" not in ms:
              ms=ms.replace("<manifest ", '<manifest ')
              ms=ms.replace("<application", '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><application',1)
          manifest.write_text(ms)
          # Inject JS sync on every page finish. Native alarms continue when WebView is backgrounded/closed.
          needle='webView.setWebViewClient(new WebViewClient(){'
          if needle not in source: raise SystemExit("WebViewClient anchor not found")
          source=source.replace(needle, 'webView.setWebViewClient(new WebViewClient(){ @Override public void onPageFinished(WebView v,String url){super.onPageFinished(v,url);v.evaluateJavascript('+__import__("json").dumps(js)+',null); }')
          java.write_text(source)
          print("Added native reminder receiver and existing-HTML notification schedule bridge.")
          PY

      - name: Route EDGEVAULT HTML notifications through native Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("android-source")
          htmls=list(root.rglob("app/src/main/assets/**/*.html"))
          if not htmls:
              htmls=[p for p in root.rglob("*.html") if "build" not in p.parts]
          if not htmls:
              raise SystemExit("No HTML assets found to patch notifications")
          patches=[
            ("const NP=()=>('Notification' in window)?Notification.permission:'unsupported';", "const NP=()=>window.EdgeVaultReminder?'granted':(('Notification' in window)?Notification.permission:'unsupported');"),
            ("async function nFire(title,body,tag){\n let ok=false;", "async function nFire(title,body,tag){\n if(window.EdgeVaultReminder){try{window.EdgeVaultReminder.notifyUser(title,body,Math.abs(String(tag||title).split('').reduce((a,c)=>((a*31+c.charCodeAt(0))|0),7))%50000+20000);return}catch(e){}}\n let ok=false;"),
            ("async function notifEnable(){\n if(NP()==='unsupported')return toast('This browser does not support notifications.');", "async function notifEnable(){\n if(window.EdgeVaultReminder){db.nt.on=1;save();go('vault');await nFire('EDGEVAULT notifications enabled','Native Android reminders are ready.','ev-test');return}\n if(NP()==='unsupported')return toast('This browser does not support notifications.');")
          ]
          changed=0
          for p in htmls:
              s=p.read_text(errors="replace")
              old=s
              for a,b in patches:
                  if a in s:s=s.replace(a,b,1)
              if s!=old:p.write_text(s);changed+=1;print("Patched",p)
          if not changed:raise SystemExit("Notification patch anchors were not found in HTML assets")
          print("Android notification compatibility patch applied to",changed,"HTML file(s)")
          PY

      - name: Repair backup import without corrupting the HTML page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("android-source")
          candidates=list(root.rglob("app/src/main/assets/**/*.html"))
          if not candidates:
              candidates=[p for p in root.rglob("*.html") if "build" not in p.parts]
          target=None
          for p in candidates:
              s=p.read_text(encoding="utf-8",errors="strict")
              if "async function restore(file)" in s or "function restore(file)" in s:
                  target=(p,s)
                  break
          if target is None:
              raise SystemExit("No restore(file) function found in app HTML")
          p,s=target

          # Parse the app's own exported CSV format (including quoted commas/newlines).
          helper=r'''function edgeVaultParseCSV(raw){
          const text=String(raw||'').replace(/^\uFEFF/,'');
          const rows=[];let row=[],field='',quoted=false;
          for(let i=0;i<text.length;i++){
            const c=text[i];
            if(quoted){
              if(c==='"'&&text[i+1]==='"'){field+='"';i++}
              else if(c==='"')quoted=false;
              else field+=c;
            }else if(c==='"')quoted=true;
            else if(c===','){row.push(field);field='';}
            else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
            else if(c==='\r'){if(text[i+1]==='\n')continue;row.push(field);rows.push(row);row=[];field='';}
            else field+=c;
          }
          if(field.length||row.length){row.push(field);rows.push(row);}
          if(rows.length<2)throw new Error('CSV has no trade rows');
          const headers=rows.shift().map(v=>String(v).trim().replace(/^\uFEFF/,'').toLowerCase());
          const ix=name=>headers.indexOf(name.toLowerCase());
          const required=['date','symbol','result','p/l'];
          if(required.some(name=>ix(name)<0))throw new Error('CSV headers do not match EDGEVAULT trade export');
          const val=(r,name)=>{const n=ix(name);return n<0?'':String(r[n]??'').trim();};
          const num=(r,name)=>{const v=val(r,name).replace(/[$,]/g,'');const n=Number(v);return Number.isFinite(n)?n:0;};
          const yesNo=(r,name)=>{const v=val(r,name).toLowerCase();return v==='yes'?true:v==='no'?false:null;};
          const split=(r,name)=>val(r,name).split(';').map(v=>v.trim()).filter(Boolean);
          const trades=rows.filter(r=>r.some(v=>String(v||'').trim())).map((r,i)=>{
            const date=val(r,'date'),symbol=val(r,'symbol').toUpperCase(),time=val(r,'time');
            const res=val(r,'result').toLowerCase();
            return {id:'CSV_'+date+'_'+symbol+'_'+time+'_'+i,date,symbol,dir:val(r,'direction').toLowerCase(),res,
              pnl:num(r,'p/l'),risk:num(r,'risked'),lot:num(r,'lot'),sl:num(r,'sl pips'),tp:num(r,'tp pips'),
              tags:split(r,'tags'),mood:val(r,'mood'),ruled:yesNo(r,'rules followed'),riskok:yesNo(r,'risk ok'),
              reason:val(r,'reason'),notes:val(r,'notes'),time:/^\d{2}:\d{2}$/.test(time)?time:'',
              mist:split(r,'mistakes'),created:0};
          }).filter(t=>/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&t.symbol&&['win','loss','be','open'].includes(t.res));
          if(!trades.length)throw new Error('No valid trades found in CSV');
          return {__csv:true,app:'EDGEVAULT',version:6,data:{trades,start:0}};
          }
          '''
          anchor="async function restore(file){let d;try{d=JSON.parse(await file.text())}catch(e){return toast('This file is not a valid backup (not JSON).')}"
          if anchor not in s:
              raise SystemExit("Restore function signature did not match expected safe patch; no HTML changed")
          restore_start="async function restore(file){let d;try{const raw=await file.text();try{d=JSON.parse(raw)}catch(jsonError){d=edgeVaultParseCSV(raw)}}catch(e){return toast('This file is not a valid EDGEVAULT backup or CSV.')}"
          s=s.replace(anchor,helper+"\n"+restore_start,1)

          old="const have=new Set(db.trades.map(t=>t.id)),fresh=T.filter(t=>!have.has(t.id));"
          new="""const have=new Set(db.trades.map(t=>t.id)),isCSV=!!(d&&d.__csv),key=t=>[t.date,String(t.symbol||'').toUpperCase(),t.time||'',t.res||'',Number(t.pnl)||0,Number(t.lot)||0].join('|'),known=new Map();db.trades.forEach(t=>{const k=key(t);known.set(k,(known.get(k)||0)+1)});const fresh=T.filter(t=>{if(have.has(t.id))return false;if(!isCSV)return true;const k=key(t),n=known.get(k)||0;if(n>0){known.set(k,n-1);return false}known.set(k,n+1);return true});"""
          if old not in s:
              raise SystemExit("Could not find restore duplicate-check anchor; no HTML changed")
          s=s.replace(old,new,1)

          # CRITICAL: the HTML also contains a generated history-page string with </body>.
          # Insert before the final real body close tag, never the first string occurrence.
          addon='''<div id="edgevault-import-backup" style="position:fixed;right:14px;bottom:84px;z-index:99999"><button type="button" id="edgevault-import-backup-btn" style="background:#d9aa43;color:#111;border:0;border-radius:12px;padding:12px 16px;font-weight:700;box-shadow:0 3px 14px #0005">Import / Restore Backup</button><input id="edgevault-import-backup-file" type="file" accept=".json,.csv,application/json,text/csv" hidden></div><script>(function(){const b=document.getElementById("edgevault-import-backup-btn"),f=document.getElementById("edgevault-import-backup-file");if(b&&f){b.addEventListener("click",()=>f.click());f.addEventListener("change",async function(){const file=this.files&&this.files[0];if(file){try{await restore(file)}catch(e){console.error(e);alert("Could not restore this backup file. Check that it is an EDGEVAULT JSON backup or exported CSV.")}finally{this.value=""}}})}})();</script>'''
          if 'id="edgevault-import-backup-btn"' not in s:
              idx=s.rfind("</body>")
              if idx<0:raise SystemExit("Could not find final HTML body close tag")
              s=s[:idx]+addon+s[idx:]
          if s.count("</script>") < 2 or s.rfind("</body>") < s.rfind('id="edgevault-import-backup-btn"'):
              raise SystemExit("HTML structure verification failed; refusing to build")
          if 'id="edgevault-import-backup-btn"' not in s or 'accept=".json,.csv,application/json,text/csv"' not in s or "function edgeVaultParseCSV(raw)" not in s:
              raise SystemExit("Backup import verification failed")
          p.write_text(s,encoding="utf-8")
          print("Repaired JSON and CSV restore in",p,"and safely inserted the button before the final </body>.")
          PY

      - name: Build release Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ "$USE_WRAPPER" = "true" ]; then
            ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
          else
            gradle --no-daemon assembleDebug assembleRelease bundleRelease
          fi

      - name: Find generated AAB
        id: find-aab
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/bundle/*/*.aab' -print -quit)"
          if [ -z "$AAB" ]; then
            echo "::error::Gradle finished but no .aab file was found."
            exit 1
          fi
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"
          echo "AAB generated at: $AAB"

      - name: Upload installable debug APK, release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: EdgeVault-Android-Release
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ steps.find-aab.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 14
